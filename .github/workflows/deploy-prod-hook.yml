name: Deploy production (HTTPS hook)

# Zelfde push-over-HTTPS flow als staging, voor productie.
# Trigger: tags v*.*.* of workflow_dispatch. NOOIT bij merges naar staging.
# Environment: production. Vereist eenmalige hook-install in public_html
# (zie deploy/hook/INSTALL.md). Draai deze workflow niet per ongeluk zonder secrets.
# De eigenlijke deploy staat in _deploy-prod-attempt.yml. Blokkeert Imunify het IP van een runner
# (403 vóór de hook, nog niets gewijzigd), dan volgt automatisch een nieuwe poging op een andere
# runner (max. 3). Alleen bij een echte fout of drie geblokkeerde pogingen wordt deze run rood.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestaande tag om te herdeployen (bijv. v0.24.4)"
        required: false
        type: string
      import_enabled:
        description: "Zet DEPLOY_IMPORT_ENABLED op prod (alleen tijdens VERHUIS)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-prod-hook
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poging-1:
    uses: ./.github/workflows/_deploy-prod-attempt.yml
    with:
      tag: ${{ inputs.tag || '' }}
      import_enabled: ${{ inputs.import_enabled || false }}
      retry_sleeps: "10 20"
    secrets: inherit

  poging-2:
    needs: poging-1
    if: needs.poging-1.outputs.blocked == 'true'
    uses: ./.github/workflows/_deploy-prod-attempt.yml
    with:
      tag: ${{ inputs.tag || '' }}
      import_enabled: ${{ inputs.import_enabled || false }}
      retry_sleeps: "10 20"
    secrets: inherit

  poging-3:
    needs: poging-2
    if: needs.poging-2.outputs.blocked == 'true'
    uses: ./.github/workflows/_deploy-prod-attempt.yml
    with:
      tag: ${{ inputs.tag || '' }}
      import_enabled: ${{ inputs.import_enabled || false }}
    secrets: inherit

  uitkomst:
    name: Uitkomst deploy
    needs: [poging-1, poging-2, poging-3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rood alleen bij een echte fout of drie geblokkeerde pogingen
        env:
          R1: ${{ needs.poging-1.result }}
          B1: ${{ needs.poging-1.outputs.blocked }}
          R2: ${{ needs.poging-2.result }}
          B2: ${{ needs.poging-2.outputs.blocked }}
          R3: ${{ needs.poging-3.result }}
          B3: ${{ needs.poging-3.outputs.blocked }}
        run: |
          set -euo pipefail
          [ "$R1" = "success" ] || { echo "::error::Poging 1 faalde (${R1})."; exit 1; }
          [ "$B1" = "true" ] || { echo "Deploy gelukt in poging 1."; exit 0; }
          [ "$R2" = "success" ] || { echo "::error::Poging 2 faalde (${R2})."; exit 1; }
          [ "$B2" = "true" ] || { echo "Deploy gelukt in poging 2 (andere runner)."; exit 0; }
          [ "$R3" = "success" ] || { echo "::error::Poging 3 faalde (${R3})."; exit 1; }
          [ "$B3" = "true" ] && { echo "::error::Imunify blokkeerde alle 3 runners; deploy niet gedaan."; exit 1; }
          echo "Deploy gelukt in poging 3 (andere runner)."
