name: Deploy production (HTTPS hook)

# Zelfde push-over-HTTPS flow als staging, voor productie.
# Trigger: tags v*.*.* of workflow_dispatch. NOOIT bij merges naar staging.
# Environment: production. Vereist eenmalige hook-install in public_html
# (zie deploy/hook/INSTALL.md). Draai deze workflow niet per ongeluk zonder secrets.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestaande tag om te herdeployen (bijv. v0.24.4)"
        required: false
        type: string
      import_enabled:
        description: "Zet DEPLOY_IMPORT_ENABLED op prod (alleen tijdens VERHUIS)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-prod-hook
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
      PROD_BASE_URL: ${{ secrets.PROD_BASE_URL }}
    steps:
      - name: Resolve ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "ref=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Alleen tags vanaf master-lijn
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git fetch origin master --depth=50
          if ! git merge-base --is-ancestor HEAD origin/master && ! git merge-base --is-ancestor origin/master HEAD; then
            echo "::error::Tag lijkt niet op master-historie; stop."
            exit 1
          fi

      - name: Secrets aanwezig?
        id: chk
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_HOOK_TOKEN:-}" ] && [ -z "${DEPLOY_TOKEN:-}" ] && [ -z "${PROD_BASE_URL:-}" ]; then
            echo "::notice::Production deploy-hook secrets ontbreken — overgeslagen."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=0
          for v in DEPLOY_HOOK_TOKEN DEPLOY_TOKEN PROD_BASE_URL; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Verplicht secret ontbreekt: ${v}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Gedeeltelijke production deploy-hook-config."
            exit 1
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
          echo "::add-mask::${DEPLOY_HOOK_TOKEN}"
          echo "::add-mask::${DEPLOY_TOKEN}"

      - name: Setup PHP 8.2
        if: steps.chk.outputs.skip != '1'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, curl, xml, zip, bcmath, intl
          coverage: none

      - name: Setup Node
        if: steps.chk.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build (composer + vite)
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build
          test -f public/build/manifest.json
          chmod +x scripts/write-robots-txt.sh
          APP_ENV_NAME=production ./scripts/write-robots-txt.sh
          test -s public/robots.txt
          grep -q 'Allow: /' public/robots.txt
          grep -q 'Sitemap: https://gratisplanten.nl/sitemap.xml' public/robots.txt
          ! grep -q 'To customize, create a robots.txt' public/robots.txt

      - name: Upload via HTTPS deploy-hook + migrate + smoke
        if: steps.chk.outputs.skip != '1'
        env:
          SITE_NAME: ${{ secrets.SITE_NAME }}
          DB_HOST: ${{ secrets.PROD_DB_HOST }}
          DB_DATABASE: ${{ secrets.PROD_DB_NAME }}
          DB_USERNAME: ${{ secrets.PROD_DB_USER }}
          DB_PASSWORD: ${{ secrets.PROD_DB_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          APP_KEY: ${{ secrets.APP_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_RETAIN_DAYS: ${{ vars.BACKUP_RETAIN_DAYS }}
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
          APP_ENV_NAME: production
          # Tag-pushes: altijd false. workflow_dispatch: input import_enabled.
          IMPORT_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.import_enabled || false }}
        run: |
          set -euo pipefail
          chmod +x scripts/deploy-hook-upload.sh scripts/dotenv-quote.sh
          for v in DB_HOST DB_DATABASE DB_USERNAME DB_PASSWORD SMTP_HOST SMTP_USER SMTP_PASS CRON_TOKEN ADMIN_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Verplicht secret/env ontbreekt: ${v}"
              exit 1
            fi
          done
          echo "::add-mask::${DB_PASSWORD}"
          echo "::add-mask::${SMTP_PASS}"
          echo "::add-mask::${ADMIN_PASSWORD}"
          echo "::add-mask::${CRON_TOKEN}"
          if [ -n "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::add-mask::${BACKUP_ENCRYPTION_KEY}"
          else
            echo "::notice::BACKUP_ENCRYPTION_KEY ontbreekt — hook behoudt bestaande server-.env-waarde (zie docs/backups.md)."
          fi
          # Normaliseer boolean → true|false voor .env
          case "$(printf '%s' "${IMPORT_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')" in
            1|true|yes) IMPORT_ENABLED=true ;;
            *) IMPORT_ENABLED=false ;;
          esac
          export IMPORT_ENABLED
          echo "::notice::DEPLOY_IMPORT_ENABLED=${IMPORT_ENABLED}"
          ./scripts/deploy-hook-upload.sh
