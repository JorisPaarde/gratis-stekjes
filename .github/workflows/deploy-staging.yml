name: Deploy staging

# Push naar staging → composer + Vite build, rsync app buiten webroot, public/ naar docroot.
# Secrets (repo-level): DEPLOY_*, STAGING_DEPLOY_PATH, STAGING_DB_*, STAGING_BASE_URL, SMTP_*, …
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      H: ${{ secrets.DEPLOY_HOST }}
      U: ${{ secrets.DEPLOY_USER }}
      P: ${{ secrets.DEPLOY_PORT }}
      D: ${{ secrets.STAGING_DEPLOY_PATH }}
      BASE: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets aanwezig?
        id: chk
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$D" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "Staging-secrets ontbreken, deploy overgeslagen."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP 8.2
        if: steps.chk.outputs.skip != '1'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, curl, xml, zip, bcmath, intl
          coverage: none

      - name: Setup Node
        if: steps.chk.outputs.skip != '1'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build
        if: steps.chk.outputs.skip != '1'
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          npm ci
          npm run build

      - name: SSH instellen
        if: steps.chk.outputs.skip != '1'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: acme-challenge map aanmaken
        if: steps.chk.outputs.skip != '1'
        run: ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" "mkdir -p '${D%/}/.well-known/acme-challenge'"

      - name: Private app-map (staging, apart van productie)
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          PRIVATE_REL='stekjes-staging-app'
          ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" \
            "DOC='${D%/}'; PRIV=\"\$(dirname \"\$DOC\")/${PRIVATE_REL}\"; mkdir -p \"\$PRIV\"/storage \"\$PRIV\"/bootstrap/cache; chmod 700 \"\$PRIV\"; echo \"\$PRIV\"" \
            > /tmp/private_path.txt
          tail -n1 /tmp/private_path.txt

      - name: Rsync Laravel-app → private map
        if: steps.chk.outputs.skip != '1'
        run: |
          PRIV="$(tail -n1 /tmp/private_path.txt)"
          rsync -rlz --delete \
            --exclude='.git/' --exclude='.github/' --exclude='node_modules/' \
            --exclude='tests/' --exclude='.env' --exclude='.env.*' \
            --exclude='storage/logs/*' --exclude='storage/framework/cache/*' \
            --exclude='storage/framework/sessions/*' --exclude='storage/framework/views/*' \
            -e "ssh -i ~/.ssh/deploy_key -p ${P:-22}" \
            ./ "$U@$H:${PRIV}/"

      - name: Rsync public/ → docroot + index.php naar app
        if: steps.chk.outputs.skip != '1'
        run: |
          PRIV="$(tail -n1 /tmp/private_path.txt)"
          cat > /tmp/public-index.php <<EOF
          <?php
          define('LARAVEL_START', microtime(true));
          require '${PRIV}/vendor/autoload.php';
          \$app = require_once '${PRIV}/bootstrap/app.php';
          \$app->handleRequest(Illuminate\\Http\\Request::capture());
          EOF
          sed -i 's/^          //' /tmp/public-index.php
          rsync -rlz --delete \
            --exclude='.well-known/' --exclude='cgi-bin/' \
            --exclude='stekjes-staging-app/' --exclude='stekjes-production-app/' \
            --exclude='stekjes-private/' --exclude='gratisplanten-app/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${P:-22}" \
            ./public/ "$U@$H:${D%/}/"
          scp -i ~/.ssh/deploy_key -P "${P:-22}" /tmp/public-index.php "$U@$H:${D%/}/index.php"

      - name: Schrijf .env uit secrets
        if: steps.chk.outputs.skip != '1'
        env:
          SITE_NAME: ${{ secrets.SITE_NAME }}
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASS: ${{ secrets.STAGING_DB_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          APP_KEY_SECRET: ${{ secrets.APP_KEY }}
        run: |
          set -euo pipefail
          PRIV="$(tail -n1 /tmp/private_path.txt)"
          EXISTING_KEY=$(ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" \
            "if [ -f '${PRIV}/.env' ]; then grep '^APP_KEY=' '${PRIV}/.env' | head -1 | cut -d= -f2-; fi" || true)
          if [ -n "${APP_KEY_SECRET:-}" ]; then APP_KEY="$APP_KEY_SECRET"
          elif [ -n "${EXISTING_KEY:-}" ]; then APP_KEY="$EXISTING_KEY"
          else APP_KEY=$(php -r 'echo "base64:".base64_encode(random_bytes(32));'); fi
          NAME="${SITE_NAME:-Gratis planten}"
          ENC=$(echo "${SMTP_SECURE:-ssl}" | tr '[:upper:]' '[:lower:]')
          umask 077
          {
            echo "APP_NAME=\"${NAME}\""
            echo "SITE_NAME=\"${NAME}\""
            echo "APP_ENV=staging"
            echo "APP_KEY=${APP_KEY}"
            echo "APP_DEBUG=false"
            echo "APP_URL=${BASE_URL}"
            echo "NOINDEX=true"
            echo "APP_LOCALE=nl"
            echo "APP_FALLBACK_LOCALE=nl"
            echo "LOG_CHANNEL=stack"
            echo "LOG_LEVEL=error"
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=${DB_HOST}"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=${DB_NAME}"
            echo "DB_USERNAME=${DB_USER}"
            echo "DB_PASSWORD=${DB_PASS}"
            echo "SESSION_DRIVER=database"
            echo "SESSION_SECURE_COOKIE=true"
            echo "QUEUE_CONNECTION=database"
            echo "CACHE_STORE=database"
            echo "MAIL_MAILER=smtp"
            echo "MAIL_HOST=${SMTP_HOST}"
            echo "MAIL_PORT=${SMTP_PORT:-465}"
            echo "MAIL_USERNAME=${SMTP_USER}"
            echo "MAIL_PASSWORD=${SMTP_PASS}"
            echo "MAIL_ENCRYPTION=${ENC}"
            echo "MAIL_FROM_ADDRESS=${SMTP_FROM}"
            echo "MAIL_FROM_NAME=\"${NAME}\""
            echo "CRON_TOKEN=${CRON_TOKEN}"
          } > /tmp/stekjes.env
          scp -i ~/.ssh/deploy_key -P "${P:-22}" /tmp/stekjes.env "$U@$H:${PRIV}/.env"
          ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" "chmod 600 '${PRIV}/.env'"
          rm -f /tmp/stekjes.env

      - name: Migrate + cache
        if: steps.chk.outputs.skip != '1'
        run: |
          PRIV="$(tail -n1 /tmp/private_path.txt)"
          ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" bash -s <<EOF
          set -euo pipefail
          cd '${PRIV}'
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache
          chmod -R ug+rwx storage bootstrap/cache
          php artisan migrate --force
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          EOF

      - name: Controle
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/home.html -w '%{http_code}' "${BASE%/}/" || echo 000)
          echo "staging http ${code}"
          test "$code" = "200"
          grep -q 'Gratis planten' /tmp/home.html
          curl -sSI "${BASE%/}/" | grep -i '^x-robots-tag' || echo "LET OP: geen X-Robots-Tag"
