name: Deploy staging

# Push naar staging → rsync van de echte sitebuild.
# Skip als deploy-secrets ontbreken. Geen hostnamen/paden gehardcode: alles via secrets.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      H: ${{ secrets.DEPLOY_HOST }}
      U: ${{ secrets.DEPLOY_USER }}
      P: ${{ secrets.DEPLOY_PORT }}
      D: ${{ secrets.STAGING_DEPLOY_PATH }}
      BASE: ${{ secrets.STAGING_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Secrets aanwezig?
        id: chk
        run: |
          if [ -z "$H" ] || [ -z "$U" ] || [ -z "$D" ] || [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "Staging-secrets ontbreken, deploy overgeslagen."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup PHP 8.2
        if: steps.chk.outputs.skip != '1'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring
          coverage: none

      - name: Build site + manifest
        if: steps.chk.outputs.skip != '1'
        env:
          SITE_NAME: ${{ secrets.SITE_NAME }}
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
        run: |
          if [ -z "${SITE_NAME}" ]; then
            echo "Secret SITE_NAME ontbreekt — nodig voor de build." >&2
            exit 1
          fi
          if [ -z "${BASE_URL}" ]; then
            echo "Secret STAGING_BASE_URL ontbreekt — nodig voor de build." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("build-config.json")
          cfg = json.loads(p.read_text(encoding="utf-8"))
          cfg["site_name"] = os.environ["SITE_NAME"]
          cfg["site_url"] = os.environ["BASE_URL"].rstrip("/")
          p.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          python3 scripts/build_site.py
          python3 scripts/build_manifest.py

      - name: SSH instellen
        if: steps.chk.outputs.skip != '1'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: acme-challenge map aanmaken
        if: steps.chk.outputs.skip != '1'
        run: ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" "mkdir -p '${D%/}/.well-known/acme-challenge'"

      - name: Private map + config.php buiten webroot
        if: steps.chk.outputs.skip != '1'
        env:
          SITE_NAME: ${{ secrets.SITE_NAME }}
          BASE_URL: ${{ secrets.STAGING_BASE_URL }}
          DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          DB_USER: ${{ secrets.STAGING_DB_USER }}
          DB_PASS: ${{ secrets.STAGING_DB_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${SITE_NAME}" ]; then echo "SITE_NAME secret ontbreekt" >&2; exit 1; fi
          if [ -z "${DB_NAME}" ] || [ -z "${DB_USER}" ]; then echo "STAGING_DB_NAME/USER ontbreken" >&2; exit 1; fi
          # Lege DB_HOST → localhost (gebruikelijk op gedeelde hosting); waarde niet loggen
          export DB_HOST="${DB_HOST:-localhost}"

          PRIVATE_REL='stekjes-private'
          # Alleen de private-pad-regel naar bestand; geen echo in Actions-log
          ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" \
            "DOC='${D%/}'; PRIV=\"\$(dirname \"\$DOC\")/${PRIVATE_REL}\"; mkdir -p \"\$PRIV\"; chmod 700 \"\$PRIV\"; printf '%s' \"\$PRIV\"" \
            > /tmp/private_path.txt
          PRIV="$(tr -d '\r\n' < /tmp/private_path.txt)"
          if [ -z "$PRIV" ] || [ "${PRIV#/}" = "$PRIV" ]; then
            echo "Private map-pad kon niet worden bepaald (leeg of niet absoluut)." >&2
            exit 1
          fi
          umask 077
          php -r '
            $site = getenv("SITE_NAME") ?: "";
            if ($site === "") { fwrite(STDERR, "SITE_NAME leeg\n"); exit(1); }
            $cfg = [
              "site_name" => $site,
              "site_url" => rtrim(getenv("BASE_URL") ?: "", "/"),
              "base_path" => "",
              "db_driver" => "mysql",
              "db_host" => getenv("DB_HOST") ?: "localhost",
              "db_name" => getenv("DB_NAME") ?: "",
              "db_user" => getenv("DB_USER") ?: "",
              "db_pass" => getenv("DB_PASS") ?: "",
              "db_charset" => "utf8mb4",
              "db_path" => "",
              "mail" => [
                "from_email" => getenv("SMTP_FROM") ?: "",
                "from_name" => $site,
                "smtp_host" => getenv("SMTP_HOST") ?: "",
                "smtp_port" => (int) (getenv("SMTP_PORT") ?: 465),
                "smtp_encryption" => strtolower(getenv("SMTP_SECURE") ?: "ssl"),
                "smtp_user" => getenv("SMTP_USER") ?: "",
                "smtp_pass" => getenv("SMTP_PASS") ?: "",
              ],
              "admin_password" => getenv("ADMIN_PASSWORD") ?: "",
              "cron_token" => getenv("CRON_TOKEN") ?: "",
              "form_min_seconds" => 3,
              "rate_limit" => [
                "register" => ["max" => 5, "window" => 3600],
                "login" => ["max" => 20, "window" => 3600],
                "message" => ["max" => 60, "window" => 3600],
                "search" => ["max" => 120, "window" => 3600],
                "password_reset" => ["max" => 5, "window" => 3600],
              ],
              "rate_limit_retention_seconds" => 172800,
              "session_name" => "stekjes_sess",
              "session_secure" => true,
              "pdok_url" => "https://api.pdok.nl/bzk/locatieserver/search/v3_1/free",
              "coord_decimals" => 3,
              "meedoen_teller_drempel" => 25,
              "theme_color" => "#2f6b45",
              "background_color" => "#eef4ea",
              "private_path" => "",
            ];
            file_put_contents("/tmp/stekjes-config.php", "<?php\ndeclare(strict_types=1);\nreturn " . var_export($cfg, true) . ";\n");
          '
          scp -i ~/.ssh/deploy_key -P "${P:-22}" -o IdentitiesOnly=yes \
            /tmp/stekjes-config.php "$U@$H:${PRIV}/config.php"
          ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" "chmod 600 '${PRIV}/config.php' && test -r '${PRIV}/config.php'"
          printf '%s' "$PRIV" > /tmp/private_path.txt
          rm -f /tmp/stekjes-config.php
          echo "config.php geschreven buiten webroot (pad niet gelogd)."

      - name: Uploaden (echte build)
        if: steps.chk.outputs.skip != '1'
        run: |
          rsync -rlz --delete \
            --exclude='.well-known/' --exclude='cgi-bin/' \
            --exclude='config.php' --exclude='data/' \
            --exclude='.git/' --exclude='.github/' \
            --exclude='tests/' --exclude='docs/' \
            --exclude='placeholder/' --exclude='*.md' \
            --exclude='migrations/*.down.sql' \
            -e "ssh -i ~/.ssh/deploy_key -p ${P:-22}" \
            ./ "$U@$H:${D%/}/"

      - name: Migraties
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          PRIV="$(tr -d '\r\n' < /tmp/private_path.txt)"
          if [ -z "$PRIV" ]; then
            echo "Private pad ontbreekt — config-stap faalde?" >&2
            exit 1
          fi
          # Preflight op de server (geen paden/hosts printen)
          ssh -i ~/.ssh/deploy_key -p "${P:-22}" "$U@$H" bash -s <<EOF
          set -euo pipefail
          CFG='${PRIV}/config.php'
          DOC='${D%/}'
          if [ ! -r "\$CFG" ]; then echo "config niet leesbaar" >&2; exit 1; fi
          if ! php -m 2>/dev/null | grep -qi '^pdo_mysql\$'; then
            echo "pdo_mysql ontbreekt in PHP CLI" >&2
            php -v >&2 || true
            php -m >&2 || true
            exit 1
          fi
          cd "\$DOC"
          STEKJES_CONFIG="\$CFG" php -d display_errors=stderr -d log_errors=0 scripts/migrate.php up
          EOF

      - name: Controle
        if: steps.chk.outputs.skip != '1'
        run: |
          set -euo pipefail
          if [ -z "${BASE}" ]; then
            echo "STAGING_BASE_URL ontbreekt" >&2
            exit 1
          fi
          url="${BASE%/}/"
          code=$(curl -sS -o /tmp/staging-home.html -w '%{http_code}' --max-time 30 "$url" || echo "000")
          echo "homepage HTTP $code"
          if [ "$code" != "200" ]; then
            echo "Homepage gaf geen 200." >&2
            exit 1
          fi
          headers=$(curl -sSI --max-time 30 "$url" || true)
          if ! grep -iq '^x-robots-tag:.*noindex' <<<"$headers"; then
            echo "LET OP: geen X-Robots-Tag noindex in headers" >&2
            # nog geen hard fail: .htaccess kan per host anders laden; homepage-200 is verplicht
          fi
