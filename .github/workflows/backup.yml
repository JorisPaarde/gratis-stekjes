name: Encrypted backups

# Dagelijks: versleutelde DB- + storage-backup op staging én productie via /cron/backup,
# daarna off-site kopie als GitHub Actions artifact (ciphertext only; sleutel blijft secret).
# De backup zelf staat in _backup-attempt.yml. Blokkeert Imunify het IP van een runner
# (403 met Imunify-tekst), dan volgt automatisch een nieuwe poging op een andere runner (max. 3).
# Alleen bij een echte fout of drie geblokkeerde pogingen wordt deze run rood.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Welke omgeving"
        type: choice
        options:
          - both
          - staging
          - production
        default: both

permissions:
  contents: read

jobs:
  stag-1:
    uses: ./.github/workflows/_backup-attempt.yml
    with:
      target: staging
      selected: ${{ github.event.inputs.target || 'both' }}
      attempt: "1"
    secrets: inherit

  stag-2:
    needs: stag-1
    if: needs.stag-1.outputs.blocked == 'true'
    uses: ./.github/workflows/_backup-attempt.yml
    with:
      target: staging
      selected: ${{ github.event.inputs.target || 'both' }}
      attempt: "2"
    secrets: inherit

  stag-3:
    needs: stag-2
    if: needs.stag-2.outputs.blocked == 'true'
    uses: ./.github/workflows/_backup-attempt.yml
    with:
      target: staging
      selected: ${{ github.event.inputs.target || 'both' }}
      attempt: "3"
    secrets: inherit

  prod-1:
    uses: ./.github/workflows/_backup-attempt.yml
    with:
      target: production
      selected: ${{ github.event.inputs.target || 'both' }}
      attempt: "1"
    secrets: inherit

  prod-2:
    needs: prod-1
    if: needs.prod-1.outputs.blocked == 'true'
    uses: ./.github/workflows/_backup-attempt.yml
    with:
      target: production
      selected: ${{ github.event.inputs.target || 'both' }}
      attempt: "2"
    secrets: inherit

  prod-3:
    needs: prod-2
    if: needs.prod-2.outputs.blocked == 'true'
    uses: ./.github/workflows/_backup-attempt.yml
    with:
      target: production
      selected: ${{ github.event.inputs.target || 'both' }}
      attempt: "3"
    secrets: inherit

  uitkomst:
    name: Uitkomst backups
    needs: [stag-1, stag-2, stag-3, prod-1, prod-2, prod-3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rood alleen bij een echte fout of drie geblokkeerde pogingen
        env:
          STAG_R1: ${{ needs.stag-1.result }}
          STAG_B1: ${{ needs.stag-1.outputs.blocked }}
          STAG_R2: ${{ needs.stag-2.result }}
          STAG_B2: ${{ needs.stag-2.outputs.blocked }}
          STAG_R3: ${{ needs.stag-3.result }}
          STAG_B3: ${{ needs.stag-3.outputs.blocked }}
          PROD_R1: ${{ needs.prod-1.result }}
          PROD_B1: ${{ needs.prod-1.outputs.blocked }}
          PROD_R2: ${{ needs.prod-2.result }}
          PROD_B2: ${{ needs.prod-2.outputs.blocked }}
          PROD_R3: ${{ needs.prod-3.result }}
          PROD_B3: ${{ needs.prod-3.outputs.blocked }}
        run: |
          set -uo pipefail
          fail=0
          check() {
            local naam="$1" r1="$2" b1="$3" r2="$4" b2="$5" r3="$6" b3="$7"
            [ "$r1" = "success" ] || { echo "::error::Backup ${naam}: poging 1 faalde (${r1})."; return 1; }
            [ "$b1" = "true" ] || { echo "Backup ${naam}: gelukt in poging 1."; return 0; }
            [ "$r2" = "success" ] || { echo "::error::Backup ${naam}: poging 2 faalde (${r2})."; return 1; }
            [ "$b2" = "true" ] || { echo "Backup ${naam}: gelukt in poging 2 (andere runner)."; return 0; }
            [ "$r3" = "success" ] || { echo "::error::Backup ${naam}: poging 3 faalde (${r3})."; return 1; }
            [ "$b3" = "true" ] && { echo "::error::Backup ${naam}: Imunify blokkeerde alle 3 runners; geen backup gemaakt."; return 1; }
            echo "Backup ${naam}: gelukt in poging 3 (andere runner)."
          }
          check staging "$STAG_R1" "$STAG_B1" "$STAG_R2" "$STAG_B2" "$STAG_R3" "$STAG_B3" || fail=1
          check production "$PROD_R1" "$PROD_B1" "$PROD_R2" "$PROD_B2" "$PROD_R3" "$PROD_B3" || fail=1
          exit "$fail"
