name: Invasive data check

on:
  pull_request:
  push:
    branches: [staging, master]
    paths:
      - "data/niet-aanbieden.json"
      - "data/deelplekken.json"
      - "data/steden.json"
      - ".github/workflows/invasive-tests.yml"

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JSON parseerbaar
        run: |
          python3 -c "import json; json.load(open('data/niet-aanbieden.json')); print('niet-aanbieden ok')"
          python3 -c "import json; d=json.load(open('data/deelplekken.json')); assert 'plekken' in d and len(d['plekken'])>=30; print('deelplekken ok', len(d['plekken']))"
          python3 -c "import json; d=json.load(open('data/steden.json')); assert 'steden' in d and len(d['steden'])>=35; print('steden ok', len(d['steden']))"
