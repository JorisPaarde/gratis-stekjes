name: Deploy staging (cPanel)

# HTTPS deploy-hook (geen :2083 / UAPI). Bouwt vendor + Vite, zip't, chunked upload
# naar /deploy-hook.php, daarna POST /deploy/run + smoke.
# De eigenlijke deploy staat in _deploy-staging-attempt.yml. Blokkeert Imunify het IP van een runner
# (403 vóór de hook, vaak langer dan een paar minuten), dan volgt automatisch een nieuwe poging op
# een andere runner (max. 3). Alleen als alle drie geblokkeerd zijn, of bij een echte fout, wordt
# deze run rood. Zo komt er alleen een mail als er echt iets mis is.
# Ontbrekende verplichte secrets → skip met notice (geen rode X) alleen als HELE
# hook-set ontbreekt; gedeeltelijk → hard fail. Hook 404 → ::error:: + INSTALL-stappen.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging-cpanel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  poging-1:
    uses: ./.github/workflows/_deploy-staging-attempt.yml
    with:
      retry_sleeps: "10 20"
    secrets: inherit

  poging-2:
    needs: poging-1
    if: needs.poging-1.outputs.blocked == 'true'
    uses: ./.github/workflows/_deploy-staging-attempt.yml
    with:
      retry_sleeps: "10 20"
    secrets: inherit

  poging-3:
    needs: poging-2
    if: needs.poging-2.outputs.blocked == 'true'
    uses: ./.github/workflows/_deploy-staging-attempt.yml
    secrets: inherit

  uitkomst:
    name: Uitkomst deploy
    needs: [poging-1, poging-2, poging-3]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Rood alleen bij een echte fout of drie geblokkeerde pogingen
        env:
          R1: ${{ needs.poging-1.result }}
          B1: ${{ needs.poging-1.outputs.blocked }}
          R2: ${{ needs.poging-2.result }}
          B2: ${{ needs.poging-2.outputs.blocked }}
          R3: ${{ needs.poging-3.result }}
          B3: ${{ needs.poging-3.outputs.blocked }}
        run: |
          set -euo pipefail
          [ "$R1" = "success" ] || { echo "::error::Poging 1 faalde (${R1})."; exit 1; }
          [ "$B1" = "true" ] || { echo "Deploy gelukt in poging 1."; exit 0; }
          [ "$R2" = "success" ] || { echo "::error::Poging 2 faalde (${R2})."; exit 1; }
          [ "$B2" = "true" ] || { echo "Deploy gelukt in poging 2 (andere runner)."; exit 0; }
          [ "$R3" = "success" ] || { echo "::error::Poging 3 faalde (${R3})."; exit 1; }
          [ "$B3" = "true" ] && { echo "::error::Imunify blokkeerde alle 3 runners; deploy niet gedaan."; exit 1; }
          echo "Deploy gelukt in poging 3 (andere runner)."
