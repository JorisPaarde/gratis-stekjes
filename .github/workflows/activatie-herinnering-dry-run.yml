name: Activatie-herinnering dry-run

# Draait gp:activatie-herinnering --dry-run op de server via POST /deploy/activatie-herinnering
# (noshell HTTPS). Alleen aantallen; stuurt nooit mail. Geen --send.
# Secrets: DEPLOY_TOKEN + STAGING_BASE_URL of PROD_BASE_URL (environment).
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Omgeving (production pas na master-deploy)"
        type: choice
        options:
          - staging
          - production
        required: true
        default: staging

permissions:
  contents: read

jobs:
  activatie-herinnering-dry-run:
    name: activatie-herinnering dry-run (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Draai gp:activatie-herinnering --dry-run op ${{ inputs.target }}
        env:
          TARGET: ${{ inputs.target }}
          STAGING_BASE: ${{ secrets.STAGING_BASE_URL }}
          PROD_BASE: ${{ secrets.PROD_BASE_URL }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "::error::DEPLOY_TOKEN ontbreekt in environment ${TARGET}."
            exit 1
          fi
          echo "::add-mask::${DEPLOY_TOKEN}"

          if [ "${TARGET}" = "production" ]; then
            BASE_URL="${PROD_BASE:-}"
            if [ -z "${BASE_URL}" ]; then
              echo "::error::PROD_BASE_URL ontbreekt (production pas na merge naar master + deploy)."
              exit 1
            fi
          else
            BASE_URL="${STAGING_BASE:-}"
            if [ -z "${BASE_URL}" ]; then
              echo "::error::STAGING_BASE_URL ontbreekt."
              exit 1
            fi
          fi

          BASE_URL="${BASE_URL%/}"
          echo "::notice::Dry-run only op ${TARGET} (geen mail, geen --send)."

          code=$(curl -sS -o /tmp/activatie-herinnering.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{}' \
            "${BASE_URL}/deploy/activatie-herinnering" || true)

          echo "${TARGET}: HTTP ${code}"
          if command -v python3 >/dev/null 2>&1 && [ -f /tmp/activatie-herinnering.json ]; then
            python3 - <<'PY'
          import json
          try:
              data = json.load(open("/tmp/activatie-herinnering.json"))
          except Exception:
              print("response: (geen JSON)")
              raise SystemExit(0)
          for k in ("ok", "error", "at"):
              if k in data:
                  print(f"{k}: {data[k]}")
          out = data.get("output") or ""
          if out:
              print("--- artisan output ---")
              print(out)
          PY
          fi

          if [ "${code}" != "200" ]; then
            echo "::error::activatie-herinnering dry-run faalde (HTTP ${code})."
            exit 1
          fi
          echo "::notice::activatie-herinnering dry-run OK op ${TARGET}."
