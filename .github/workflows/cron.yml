name: Daily cron

# Roept /cron aan met CRON_TOKEN (herinneringsmails + geocode-purge).
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Cron-endpoint
        env:
          BASE: ${{ secrets.BASE_URL }}
          STAGING_BASE: ${{ secrets.STAGING_BASE_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_TOKEN:-}" ]; then
            echo "CRON_TOKEN ontbreekt — overgeslagen."
            exit 0
          fi
          # Prefer productie BASE_URL; val terug op staging.
          TARGET="${BASE:-${STAGING_BASE:-}}"
          if [ -z "${TARGET}" ]; then
            echo "BASE_URL / STAGING_BASE_URL ontbreekt — overgeslagen."
            exit 0
          fi
          code=$(curl -sS -o /tmp/cron-out.txt -w '%{http_code}' \
            -H "X-Cron-Token: ${CRON_TOKEN}" \
            "${TARGET%/}/cron" || true)
          echo "HTTP $code"
          if [ "$code" = "000" ] || [ "$code" = "404" ] || [ "$code" = "502" ] || [ "$code" = "503" ]; then
            echo "Site nog niet bereikbaar of endpoint ontbreekt — ok voor nu."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "Onverwachte status"
            head -c 400 /tmp/cron-out.txt || true
            exit 1
          fi
          head -c 400 /tmp/cron-out.txt || true
