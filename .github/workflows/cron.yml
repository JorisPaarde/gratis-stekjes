name: Cron queue & expiry

# Roept /cron aan (queue:work + herinneringsmails + geocode-purge) op staging én productie.
# Productie gebruikt de secrets van environment "production" (eigen URL en CRON_TOKEN).
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: ping (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: staging
            env_name: ""
          - target: production
            env_name: production
    environment: ${{ matrix.env_name }}
    steps:
      - name: Cron-endpoint
        env:
          LABEL: ${{ matrix.target }}
          TARGET_URL: ${{ matrix.target == 'production' && (secrets.PROD_BASE_URL || secrets.BASE_URL) || secrets.STAGING_BASE_URL }}
          CRON_TOKEN: ${{ secrets.CRON_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_TOKEN:-}" ]; then
            echo "${LABEL}: CRON_TOKEN ontbreekt — overgeslagen."
            exit 0
          fi
          if [ -z "${TARGET_URL:-}" ]; then
            echo "${LABEL}: URL niet gezet — overgeslagen."
            exit 0
          fi
          code=$(curl -sS -o /tmp/cron.txt -w '%{http_code}' \
            -H "X-Cron-Token: ${CRON_TOKEN}" \
            "${TARGET_URL%/}/cron" || true)
          echo "${LABEL}: HTTP ${code}"
          if [ "$code" = "000" ] || [ "$code" = "404" ] || [ "$code" = "502" ] || [ "$code" = "503" ]; then
            echo "${LABEL}: site nog niet bereikbaar of endpoint ontbreekt — ok voor nu."
            exit 0
          fi
          head -c 400 /tmp/cron.txt || true
          echo
          [ "$code" = "200" ]
