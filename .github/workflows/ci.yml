name: CI

on:
  pull_request:
  push:
    branches: [staging, master]

jobs:
  master-from-staging-only:
    name: PR naar master alleen van staging
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Controleer head-branch
        run: |
          set -euo pipefail
          head="${{ github.head_ref }}"
          echo "PR naar master vanaf: $head"
          if [ "$head" != "staging" ]; then
            echo "::error::PR's naar master mogen alleen vanaf branch 'staging'."
            exit 1
          fi

  build-test:
    name: Build, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, mbstring
          coverage: none

      - name: Build static pages + manifest
        env:
          SITE_NAME: ${{ secrets.SITE_NAME }}
          BASE_URL: http://127.0.0.1
        run: |
          export SITE_NAME="${SITE_NAME:-CI build}"
          python3 scripts/build_site.py
          python3 scripts/build_manifest.py

      - name: PHP lint
        run: |
          set -euo pipefail
          while IFS= read -r f; do
            php -l "$f" >/dev/null
          done < <(find . -name '*.php' -not -path './vendor/*')
          echo "php -l OK"

      - name: PHP tests — webapp (SQLite)
        run: |
          export STEKJES_TEST_DB="${RUNNER_TEMP}/stekjes-ci.sqlite"
          export STEKJES_MAIL_CAPTURE="${RUNNER_TEMP}/mail.ndjson"
          rm -f "$STEKJES_TEST_DB"
          php tests/webapp.php

      - name: PHP tests — invasieve module
        run: php tests/run.php

      - name: JS syntax check
        run: |
          for f in assets/js/*.js; do
            node --check "$f"
          done
          node --check sw.js

      - name: HTML linkcheck
        run: python3 .github/scripts/linkcheck.py
