name: CI

on:
  pull_request:
  push:
    branches: [staging, master]

jobs:
  master-from-staging-only:
    name: PR naar master alleen van staging
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Controleer head-branch
        run: |
          set -euo pipefail
          head="${{ github.head_ref }}"
          echo "PR naar master vanaf: $head"
          if [ "$head" != "staging" ]; then
            echo "::error::PR's naar master mogen alleen vanaf branch 'staging'."
            exit 1
          fi

  build-test:
    name: Build, lint, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Geen merge-conflictmarkeringen
        run: |
          set -euo pipefail
          # Alleen echte git-conflictmarkeringen: ^<<<<<<<( |$), ^=======$, ^>>>>>>>( |$)
          pattern='^(<{7}( |$)|={7}$|>{7}( |$))'
          if git grep -nE "$pattern" -- . \
            ':(exclude)vendor/**' ':(exclude)node_modules/**' ':(exclude)public/build/**' \
            ; then
            echo "::error::Merge-conflictmarkeringen gevonden in getrackte bestanden."
            exit 1
          fi
          echo "Geen conflictmarkeringen."

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, mbstring, curl, xml, zip, bcmath, intl, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: NPM ci + build
        run: |
          npm ci
          npm run build

      - name: Deploy-hook lint + self-test
        run: |
          php -l deploy/hook/deploy-hook.php
          php -l deploy/hook/lib.php
          php deploy/hook/self-test.php

      - name: Validate data JSON
        run: |
          python3 -c "import json; json.load(open('data/niet-aanbieden.json')); print('niet-aanbieden ok')"
          python3 -c "import json; d=json.load(open('data/deelplekken.json')); assert 'plekken' in d and len(d['plekken'])>=30; print('deelplekken ok', len(d['plekken']))"
          python3 -c "import json; d=json.load(open('data/steden.json')); assert 'steden' in d and len(d['steden'])>=35; print('steden ok', len(d['steden']))"
          python3 -c "import json; d=json.load(open('data/organisaties.json')); assert 'organisaties' in d and len(d['organisaties'])>=10; print('organisaties ok', len(d['organisaties']))"

      - name: Blade views compileren (view:cache)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan view:cache
          php artisan view:clear

      - name: Pest tests
        run: |
          test -f .env || { cp .env.example .env && php artisan key:generate; }
          ./vendor/bin/pest

      - name: Homepage v2 Playwright (above the fold)
        env:
          HOMEPAGE_V2: "true"
          HOMEPAGE_ARTIFACTS_DIR: artifacts/homepage-v2
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:8000
        run: |
          set -euo pipefail
          test -f .env || { cp .env.example .env && php artisan key:generate; }
          # Force v2 for the local server (phpunit force=false does not apply here).
          grep -q '^HOMEPAGE_V2=' .env && sed -i 's/^HOMEPAGE_V2=.*/HOMEPAGE_V2=true/' .env || echo 'HOMEPAGE_V2=true' >> .env
          grep -q '^APP_ENV=' .env && sed -i 's/^APP_ENV=.*/APP_ENV=local/' .env || echo 'APP_ENV=local' >> .env
          touch database/database.sqlite
          php artisan config:clear
          php artisan migrate --force --no-interaction
          npx playwright install --with-deps chromium
          mkdir -p artifacts/homepage-v2
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/artisan-serve-ci.log 2>&1 &
          echo $! > /tmp/artisan-serve-ci.pid
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS "$PLAYWRIGHT_BASE_URL/" -o /tmp/home-ci.html; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            echo "::error::artisan serve startte niet op :8000"
            cat /tmp/artisan-serve-ci.log || true
            exit 1
          fi
          grep -q 'page-home-v2' /tmp/home-ci.html || {
            echo "::error::Homepage mist page-home-v2 (HOMEPAGE_V2 niet actief?)"
            head -c 2000 /tmp/home-ci.html || true
            cat /tmp/artisan-serve-ci.log || true
            exit 1
          }
          npm run test:e2e:homepage
          kill "$(cat /tmp/artisan-serve-ci.pid)" 2>/dev/null || true

      - name: Upload homepage-v2 screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-v2-screenshots
          path: artifacts/homepage-v2/
          if-no-files-found: warn
          retention-days: 14
